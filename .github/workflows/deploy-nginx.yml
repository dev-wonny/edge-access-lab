name: Deploy Nginx TLS lab

on:
  pull_request:
    paths:
      - "infra/nginx/*.conf"
      - "infra/deploy/deploy-*.sh"
      - "infra/tests/**"
      - ".github/workflows/deploy-nginx.yml"
  push:
    branches: [main]
    paths:
      - "infra/nginx/*.conf"
      - "infra/deploy/deploy-*.sh"
      - "infra/tests/**"
      - ".github/workflows/deploy-nginx.yml"
  workflow_dispatch:
    inputs:
      site:
        description: "infiniteloopclub = TLS 비교 실험, devwonny = 루트/www HTTPS"
        type: choice
        required: true
        default: infiniteloopclub
        options: [infiniteloopclub, devwonny]
      certificate_mode:
        description: "normal = 정상 인증서, mismatch = infiniteloopclub 전용 이름 불일치 실험"
        type: choice
        required: true
        default: normal
        options: [normal, mismatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 배포 및 복구 테스트
        run: |
          bash -n infra/deploy/deploy-nginx.sh
          bash -n infra/deploy/deploy-devwonny.sh
          python3 -m unittest discover -s infra/tests -v

  deploy:
    # PR/push는 테스트만 실행. EC2 변경은 main에서 수동 실행할 때만 한다.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      # 기존 Python 배포와 EC2 변경이 겹치지 않도록 같은 그룹을 사용한다.
      group: deploy-python-origin
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      CERTIFICATE_MODE: ${{ inputs.certificate_mode }}
      DEPLOY_SITE: ${{ inputs.site }}
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 필수 설정 확인
        run: |
          : "${AWS_REGION:?AWS_REGION 변수가 필요합니다}"
          : "${AWS_ROLE_ARN:?AWS_ROLE_ARN 변수가 필요합니다}"
          : "${EC2_INSTANCE_ID:?EC2_INSTANCE_ID 변수가 필요합니다}"
      - name: AWS 역할로 인증
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-nginx-deploy
          retry-max-attempts: 2
      - name: 해당 커밋의 설정을 SSM으로 전달
        id: send
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import shlex

          mode = os.environ["CERTIFICATE_MODE"]
          site = os.environ["DEPLOY_SITE"]
          if mode not in {"normal", "mismatch"}:
              raise SystemExit("Unknown certificate mode")
          if site == "infiniteloopclub":
              deploy_script = "infra/deploy/deploy-nginx.sh"
              nginx_config = "infra/nginx/infiniteloopclub.conf"
              arguments = [mode]
          elif site == "devwonny" and mode == "normal":
              deploy_script = "infra/deploy/deploy-devwonny.sh"
              nginx_config = "infra/nginx/devwonny.conf"
              arguments = []
          else:
              raise SystemExit("Unknown site or unsupported mismatch mode for devwonny")
          # 인증서/개인키 없이 스크립트와 Nginx 설정 두 파일만 전송한다.
          script = [
              "set -euo pipefail",
              'work=$(mktemp -d /tmp/nginx-deploy.XXXXXXXX)',
              "trap 'rm -rf -- \"$work\"' EXIT",
              'cd "$work"',
              "mkdir -p infra/deploy infra/nginx",
          ]
          for name in (deploy_script, nginx_config):
              encoded = base64.b64encode(pathlib.Path(name).read_bytes()).decode()
              script.append(f"printf %s {shlex.quote(encoded)} | base64 --decode > {shlex.quote(name)}")
          script.append("export DEPLOY_REVISION=" + shlex.quote(os.environ["GITHUB_SHA"]))
          script.append(shlex.join(["bash", deploy_script, *arguments]))
          parameters = {
              "commands": ["bash -c " + shlex.quote("\n".join(script))],
              "executionTimeout": ["600"],
          }
          pathlib.Path("ssm-parameters.json").write_text(json.dumps(parameters))
          PY
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 60 \
            --comment "Nginx: $DEPLOY_SITE / $CERTIFICATE_MODE" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command: $command_id; site=$DEPLOY_SITE; mode=$CERTIFICATE_MODE; revision=$GITHUB_SHA"

      - name: EC2 실행 결과 확인
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 130); do
            if aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --output json > result.json 2> invocation-error.txt; then
              status=$(jq -r '.Status' result.json)
              echo "EC2 실행 상태: $status"
              case "$status" in
                Success)
                  jq -r '.StandardOutputContent, .StandardErrorContent' result.json
                  echo "Nginx: $DEPLOY_SITE / $CERTIFICATE_MODE / $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                Pending|InProgress|Delayed) ;;
                *)
                  jq -r '.StandardOutputContent, .StandardErrorContent' result.json
                  exit 1
                  ;;
              esac
            elif ! grep -q InvocationDoesNotExist invocation-error.txt; then
              cat invocation-error.txt
              exit 1
            fi
            sleep 5
          done
          echo "결과 대기 시간 초과. SSM 명령 $COMMAND_ID 상태를 확인해주세요."
          exit 1
