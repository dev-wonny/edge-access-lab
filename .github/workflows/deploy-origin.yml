name: Deploy Python origin

on:
  # Actions 화면의 Run workflow 버튼으로 직접 실행
  workflow_dispatch:

permissions:
  # AWS 인증에 사용할 GitHub OIDC 토큰 발급 허용
  id-token: write
  contents: read

jobs:
  deploy:
    # IAM에서 허용한 main 브랜치에서만 실행
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: 필수 설정값 확인
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # 변수가 비어 있으면 해당 변수 이름과 함께 실패 처리
          : "${AWS_REGION:?Repository variable AWS_REGION을 등록해주세요}"
          : "${AWS_ROLE_ARN:?Repository variable AWS_ROLE_ARN을 등록해주세요}"
          : "${EC2_INSTANCE_ID:?Repository variable EC2_INSTANCE_ID를 등록해주세요}"

          echo "필수 설정값이 등록되어 있습니다."

      - name: AWS 신뢰 정책과 비교할 식별자 확인
        # 토큰 원문과 서명은 출력하지 않는다.
        # IAM 신뢰 정책에 필요한 sub와 aud만 출력한다.
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.parse
          import urllib.request

          # GitHub가 제공하는 OIDC 토큰 발급 주소
          parts = urllib.parse.urlsplit(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          )
          query = urllib.parse.parse_qsl(
              parts.query, keep_blank_values=True
          )
          query = [(key, value) for key, value in query if key != "audience"]
          query.append(("audience", "sts.amazonaws.com"))

          url = urllib.parse.urlunsplit(
              parts._replace(query=urllib.parse.urlencode(query))
          )

          # GitHub 실행 환경의 인증값으로 OIDC 토큰 요청
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                      "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request, timeout=15) as response:
              token = json.load(response)["value"]

          # 식별자 확인을 위해 JWT payload만 디코딩한다.
          # 실제 토큰 검증과 역할 사용 허용 여부 판단은 AWS가 수행한다.
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("sub:", claims["sub"])
          print("aud:", claims["aud"])
          PY

      - name: AWS 역할로 인증
        # 고정된 버전의 공식 AWS 인증 Action 사용
        # GitHub OIDC 토큰을 AWS 임시 자격 증명으로 교환
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-origin-deploy
          allowed-account-ids: "614099836907"
          retry-max-attempts: 2

      - name: 인증된 AWS 계정과 역할 확인
        # 인증 성공 시 계정 번호와 사용 중인 역할 ARN 출력
        run: aws sts get-caller-identity
