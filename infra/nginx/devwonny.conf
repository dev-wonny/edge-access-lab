# Root/www site, separate from origin.devwonny.win and the TLS mismatch lab.
# Certificate issuance and renewal use Cloudflare DNS-01; port 80 is not required.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name devwonny.win www.devwonny.win;

    ssl_certificate /etc/letsencrypt/live/devwonny.win/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devwonny.win/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name devwonny.win www.devwonny.win;
    return 301 https://$host$request_uri;
}
