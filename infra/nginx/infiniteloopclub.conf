# Installed at /etc/nginx/sites-available/infiniteloopclub.
# Enabled by /etc/nginx/sites-enabled/infiniteloopclub symlink.
# Normal certificate configuration. GitHub Actions can apply/restore this file.
# Certificate contents and private keys stay on EC2 (Certbot manages renewal).
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name infiniteloopclub.cloud www.infiniteloopclub.cloud;

    ssl_certificate /etc/letsencrypt/live/infiniteloopclub.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infiniteloopclub.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name infiniteloopclub.cloud www.infiniteloopclub.cloud;

    if ($host = www.infiniteloopclub.cloud) {
        return 301 https://$host$request_uri;
    }
    if ($host = infiniteloopclub.cloud) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
