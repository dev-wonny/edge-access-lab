# Installed at /etc/nginx/sites-available/infiniteloopclub.
# Enabled by /etc/nginx/sites-enabled/infiniteloopclub symlink.
# HTTP DNS-only lab: Host selects this server; every path goes to the local app.
server {
    listen 80;
    listen [::]:80;

    server_name infiniteloopclub.cloud www.infiniteloopclub.cloud;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
